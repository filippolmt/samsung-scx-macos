name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/*
      - name: shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shfmt
          shfmt -d -i 2 -ci -bn bin/*
      - name: no real LAN addresses
        run: |
          # -o prints file:line:address per match, so the placeholder filter is exact.
          # -I skips binaries. shortcut: a 4-part version string starting with 10. is a false
          # positive; add an allowlist if one ever needs committing.
          leaks=$(git ls-files -z | xargs -0 grep -InoP '(?<![\d.])(192\.168|10\.\d{1,3}|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}(?!\d)' \
            | grep -v ':192\.168\.1\.50$' || true)
          [ -z "$leaks" ] || { echo "Private address other than the 192.168.1.50 placeholder:"; echo "$leaks"; exit 1; }
